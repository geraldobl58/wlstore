<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 980 410" width="980" height="410" role="img" aria-label="Pricing fora do ar: as cartas ficam guardadas na fila">
<title>Pricing fora do ar: as cartas ficam guardadas na fila</title>
<style>
:root{--bg:#ffffff;--surface:#f6f8fa;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--accent:#e8590c;--ok:#1a7f4b;--bad:#cf222e;--accent-soft:#ffe8d9}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--surface:#151b23;--ink:#e6edf3;--muted:#9198a1;--line:#30363d;--accent:#ff7a2f;--ok:#3fb950;--bad:#ff7b72;--accent-soft:#3a2518}}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.title{font-weight:700;font-size:16px}
.sub{fill:var(--muted);font-size:12px}
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.accent{stroke:var(--accent);stroke-width:2}
.slot{fill:none;stroke:var(--line);stroke-dasharray:3 3}
.link{stroke:var(--muted);stroke-width:1.6;fill:none}
.msg rect{fill:var(--accent);stroke:var(--bg);stroke-width:1.5}
.msg path{fill:none;stroke:#fff;stroke-width:1.5}
.msg text{font-size:10px;fill:var(--muted);text-anchor:middle;font-family:ui-monospace,Menlo,Consolas,monospace}
.pillon{fill:var(--ok)}.silloff{fill:var(--bad)}
.pilltxt{fill:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-anchor:middle}
.big{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;font-weight:600;text-anchor:middle}
.cap{font-size:15px}
.tag{font-size:11px;fill:var(--accent);font-weight:700;letter-spacing:.08em;font-family:ui-monospace,Menlo,Consolas,monospace}
.vis{opacity:0;animation-timing-function:step-end!important}
