 22s infinite}@keyframes v13{0.000%{opacity:1}66.364%{opacity:0}98.182%{opacity:1}100.000%{opacity:0}}.v13{animation:v13 22s infinite}@keyframes v14{0.000%{opacity:0}66.364%{opacity:1}74.545%{opacity:0}100.000%{opacity:0}}.v14{animation:v14 22s infinite}@keyframes v15{0.000%{opacity:0}74.545%{opacity:1}81.818%{opacity:0}100.000%{opacity:0}}.v15{animation:v15 22s infinite}@keyframes v16{0.000%{opacity:0}81.818%{opacity:1}98.182%{opacity:0}100.000%{opacity:0}}.v16{animation:v16 22s infinite}@keyframes v17{0.000%{opacity:1}66.364%{opacity:0}98.182%{opacity:1}100.000%{opacity:0}}.v17{animation:v17 22s infinite}@keyframes v18{0.000%{opacity:0}66.364%{opacity:1}74.545%{opacity:0}100.000%{opacity:0}}.v18{animation:v18 22s infinite}@keyframes v19{0.000%{opacity:0}74.545%{opacity:1}81.818%{opacity:0}100.000%{opacity:0}}.v19{animation:v19 22s infinite}@keyframes v20{0.000%{opacity:0}81.818%{opacity:1}98.182%{opacity:0}100.000%{opacity:0}}.v20{animation:v20 22s infinite}@keyframes v21{0.000%{opacity:1}54.545%{opacity:0}100.000%{opacity:0}}.v21{animation:v21 22s infinite}@keyframes v22{0.000%{opacity:0}54.545%{opacity:1}100.000%{opacity:0}}.v22{animation:v22 22s infinite}@keyframes v23{0.000%{opacity:1}54.545%{opacity:0}100.000%{opacity:0}}.v23{animation:v23 22s infinite}@keyframes v24{0.000%{opacity:0}54.545%{opacity:1}61.364%{opacity:0}84.091%{opacity:1}100.000%{opacity:0}}.v24{animation:v24 22s infinite}@keyframes v25{0.000%{opacity:0}61.364%{opacity:1}84.091%{opacity:0}100.000%{opacity:0}}.v25{animation:v25 22s infinite}</style>
<rect x="0" y="70" width="980" height="410" fill="var(--bg)"/>
<!-- Catalogo -->
<rect class="node" x="20" y="100" width="190" height="230" rx="12"/>
<text class="title" x="115" y="128" text-anchor="middle">Catálogo</text>
<text class="sub" x="115" y="146" text-anchor="middle">quem publica</text>
<rect class="node" x="38" y="162" width="154" height="40" rx="8"/>
<text class="mono" x="115" y="187" text-anchor="middle">tb_product</text>
<rect class="node accent" x="38" y="216" width="154" height="94" rx="8"/>
<text class="mono" x="115" y="236" text-anchor="middle">tb_outbox</text>
<!-- Exchange -->
<rect class="node accent" x="300" y="175" width="170" height="80" rx="12"/>
<text class="title" x="385" y="205" text-anchor="middle">Exchange</text>
<text class="mono" x="385" y="224" text-anchor="middle">catalog.events</text>
<text class="sub" x="385" y="242" text-anchor="middle">só roteia, não guarda</text>
<!-- Fila -->
<rect class="node accent" x="560" y="90" width="190" height="70" rx="12"/>
<text class="mono" x="655" y="108" text-anchor="middle">pricing.catalog-events</text>
<rect class="slot" x="568" y="128" width="28" height="20" rx="3"/><rect class="slot" x="604" y="128" width="28" height="20" rx="3"/><rect class="slot" x="640" y="128" width="28" height="20" rx="3"/><rect class="slot" x="676" y="128" width="28" height="20" rx="3"/><rect class="slot" x="712" y="128" width="28" height="20" rx="3"/>
<text class="sub" x="620" y="196" text-anchor="middle">Ready</text>
<text class="sub" x="700" y="196" text-anchor="middle">Unacked</text>
<!-- Pricing -->
<rect class="node" x="800" y="90" width="160" height="280" rx="12"/>
<text class="title" x="880" y="118" text-anchor="middle">Pricing</text>
<text class="sub" x="880" y="296" text-anchor="middle">tb_known_sku</text>
<text class="sub" x="880" y="346" text-anchor="middle">tb_processed_event</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<line class="link" x1="210" y1="215" x2="298" y2="215" marker-end="url(#a)"/>
<text class="sub" x="254" y="206" text-anchor="middle">publica</text>
<line class="link" x1="470" y1="203" x2="558" y2="135" marker-end="url(#a)"/>
<text class="mono" x="430" y="166" text-anchor="middle" style="fill:var(--accent)">binding product.*</text>
<line class="link" x1="750" y1="125" x2="798" y2="125" marker-end="url(#a)"/>
<text class="sub" x="775" y="112" text-anchor="middle">entrega</text>
<g class="vis v22"><rect class="pillon" x="840" y="130" width="80" height="20" rx="10"/><text class="pilltxt" x="880" y="144">ONLINE</text></g><g class="vis v21"><rect class="silloff" x="840" y="130" width="80" height="20" rx="10"/><text class="pilltxt" x="880" y="144">OFFLINE</text></g><text class="sub vis v23" x="880" y="178" text-anchor="middle">fora do ar</text><text class="sub vis v24" x="880" y="178" text-anchor="middle">aguardando cartas</text><text class="sub vis v25" x="880" y="178" text-anchor="middle">lendo a fila</text>
<text class="tag vis v1" x="24" y="424">PASSO 1 DE 6</text><text class="cap vis v1" x="24" y="446">O pricing cai (deploy, bug, manutenção).</text><text class="cap vis v1" x="24" y="468">O catálogo não sabe disso e continua trabalhando.</text><text class="tag vis v2" x="24" y="424">PASSO 2 DE 6</text><text class="cap vis v2" x="24" y="446">Chegam 3 produtos novos. O catálogo publica normalmente</text><text class="cap vis v2" x="24" y="468">e as cartas entram na fila do pricing.</text><text class="tag vis v3" x="24" y="424">PASSO 3 DE 6</text><text class="cap vis v3" x="24" y="446">As 3 cartas ficam guardadas: Ready = 3.</text><text class="cap vis v3" x="24" y="468">A fila é durável, então nada se perde.</text><text class="tag vis v4" x="24" y="424">PASSO 4 DE 6</text><text class="cap vis v4" x="24" y="446">O pricing volta ao ar e começa a ler a fila.</text><text class="tag vis v5" x="24" y="424">PASSO 5 DE 6</text><text class="cap vis v5" x="24" y="446">Uma carta de cada vez, na ordem de chegada:</text><text class="cap vis v5" x="24" y="468">grava o SKU, anota no inbox e confirma.</text><text class="tag vis v6" x="24" y="424">PASSO 6 DE 6</text><text class="cap vis v6" x="24" y="446">Resultado: 3 SKUs gravados, fila vazia e nenhuma carta perdida.</text><text class="big vis v7" x="620" y="222">0</text><text class="big vis v8" x="620" y="222">1</text><text class="big vis v9" x="620" y="222">2</text><text class="big vis v10" x="620" y="222">3</text><text class="big vis v11" x="700" y="222">0</text><text class="big vis v12" x="700" y="222">1</text><text class="big vis v13" x="880" y="322">0</text><text class="big vis v14" x="880" y="322">1</text><text class="big vis v15" x="880" y="322">2</text><text class="big vis v16" x="880" y="322">3</text><text class="big vis v17" x="880" y="372">0</text><text class="big vis v18" x="880" y="372">1</text><text class="big vis v19" x="880" y="372">2</text><text class="big vis v20" x="880" y="372">3</text>
<g class="msg m0"><rect width="28" height="20" rx="3"/><path d="M2 3 L14 12 L26 3"/><text x="14" y="-4">#1</text></g><g class="msg m1"><rect width="28" height="20" rx="3"/><path d="M2 3 L14 12 L26 3"/><text x="14" y="-4">#2</text></g><g class="msg m2"><rect width="28" height="20" rx="3"/><path d="M2 3 L14 12 L26 3"/><text x="14" y="-4">#3</text></g>
<line x1="24" y1="404" x2="956" y2="404" stroke="var(--line)"/>
</svg>