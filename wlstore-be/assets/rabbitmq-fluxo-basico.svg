<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 980 410" width="980" height="410" role="img" aria-label="Fluxo básico: catálogo publica, RabbitMQ roteia, pricing consome">
<title>Fluxo básico: catálogo publica, RabbitMQ roteia, pricing consome</title>
<style>
:root{--bg:#ffffff;--surface:#f6f8fa;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--accent:#e8590c;--ok:#1a7f4b;--bad:#cf222e;--accent-soft:#ffe8d9}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--surface:#151b23;--ink:#e6edf3;--muted:#9198a1;--line:#30363d;--accent:#ff7a2f;--ok:#3fb950;--bad:#ff7b72;--accent-soft:#3a2518}}
text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.title{font-weight:700;font-size:16px}
.sub{fill:var(--muted);font-size:12px}
.node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.accent{stroke:var(--accent);stroke-width:2}
.slot{fill:none;stroke:var(--line);stroke-dasharray:3 3}
.link{stroke:var(--muted);stroke-width:1.6;fill:none}
.msg rect{fill:var(--accent);stroke:var(--bg);stroke-width:1.5}
.msg path{fill:none;stroke:#fff;stroke-width:1.5}
.msg text{font-size:10px;fill:var(--muted);text-anchor:middle;font-family:ui-monospace,Menlo,Consolas,monospace}
.pillon{fill:var(--ok)}.silloff{fill:var(--bad)}
.pilltxt{fill:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-anchor:middle}
.big{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;font-weight:600;text-anchor:middle}
.cap{font-size:15px}
.tag{font-size:11px;fill:var(--accent);font-weight:700;letter-spacing:.08em;font-family:ui-monospace,Menlo,Consolas,monospace}
.vis{opacity:0;animation-timing-function:step-end!important}
@keyframes m0{0.000%{transform:translate(101px,272px);opacity:0}1.500%{transform:translate(101px,272px);opacity:0}2.500%{transform:translate(101px,272px);opacity:1}13.000%{transform:translate(101px,272px);opacity:1}20.000%{transform:translate(371px,205px);opacity:1}26.000%{transform:translate(371px,205px);opacity:1}33.000%{transform:translate(568px,128px);opacity:1}52.000%{transform:translate(568px,128px);opacity:1}59.000%{transform:translate(866px,222px);opacity:1}78.000%{transform:translate(866px,222px);opacity:1}81.000%{transform:translate(866px,222px);opacity:0}100.000%{transform:translate(866px,222px);opacity:0}}.m0{animation:m0 20s infinite;animation-timing-function:ease-in-out;opacity:0}@keyframes v1{0.000%{opacity:1}13.000%{opacity:0}100.000%{opacity:0}}.v1{animation:v1 20s infinite}@keyframes v2{0.000%{opacity:0}13.000%{opacity:1}26.000%{opacity:0}100.000%{opacity:0}}.v2{animation:v2 20s infinite}@keyframes v3{0.000%{opacity:0}26.000%{opacity:1}39.000%{opacity:0}100.000%{opacity:0}}.v3{animation:v3 20s infinite}@keyframes v4{0.000%{opacity:0}39.000%{opacity:1}52.000%{opacity:0}100.000%{opacity:0}}.v4{animation:v4 20s infinite}@keyframes v5{0.000%{opacity:0}52.000%{opacity:1}65.000%{opacity:0}100.000%{opacity:0}}.v5{animation:v5 20s infinite}@keyframes v6{0.000%{opacity:0}65.000%{opacity:1}78.000%{opacity:0}100.000%{opacity:0}}.v6{animation:v6 20s infinite}@keyframes v7{0.000%{opacity:0}78.000%{opacity:1}100.000%{opacity:0}}.v7{animation:v7 20s infinite}@keyframes v8{0.000%{opacity:1}33.000%{opacity:0}52.000%{opacity:1}100.000%{opacity:0}}.v8{animation:v8 20s infinite}@keyframes v9{0.000%{opacity:0}33.000%{opacity:1}52.000%{opacity:0}100.000%{opacity:0}}.v9{animation:v9 20s infinite}@keyframes v10{0.000%{opacity:1}52.000%{opacity:0}78.000%{opacity:1}100.000%{opacity:0}}.v10{animation:v10 20s infinite}@keyframes v11{0.000%{opacity:0}52.000%{opacity:1}78.000%{opacity:0}100.000%{opacity:0}}.v11{animation:v11 20s infinite}@keyframes v12{0.000%{opacity:1}67.000%{opacity:0}98.000%{opacity:1}100.000%{opacity:0}}.v12{animation:v12 20s infinite}@keyframes v13{0.000%{opacity:0}67.000%{opacity:1}98.000%{opacity:0}100.000%{opacity:0}}.v13{animation:v13 20s infinite}@keyframes v14{0.000%{opacity:1}67.000%{opacity:0}98.000%{opacity:1}100.000%{opacity:0}}.v14{animation:v14 20s infinite}@keyframes v15{0.000%{opacity:0}67.000%{opacity:1}98.000%{opacity:0}100.000%{opacity:0}}.v15{animation:v15 20s infinite}@keyframes v16{0.000%{opacity:0}100.000%{opacity:0}}.v16{animation:v16 20s infinite}@keyframes v17{0.000%{opacity:1}100.000%{opacity:0}}.v17{animation:v17 20s infinite}@keyframes v18{0.000%{opacity:1}52.000%{opacity:0}85.000%{opacity:1}100.000%{opacity:0}}.v18{animation:v18 20s infinite}@keyframes v19{0.000%{opacity:0}52.000%{opacity:1}67.000%{opacity:0}100.000%{opacity:0}}.v19{animation:v19 20s infinite}@keyframes v20{0.000%{opacity:0}67.000%{opacity:1}78.000%{opacity:0}100.000%{opacity:0}}.v20{animation:v20 20s infinite}@keyframes v21{0.000%{opacity:0}78.000%{opacity:1}85.000%{opacity:0}100.000%{opacity:0}}.v21{animation:v21 20s infinite}</style>
<rect x="0" y="70" width="980" height="410" fill="var(--bg)"/>
<!-- Catalogo -->
<rect class="node" x="20" y="100" width="190" height="230" rx="12"/>
<text class="title" x="115" y="128" text-anchor="middle">Catálogo</text>
<text class="sub" x="115" y="146" text-anchor="middle">quem publica</text>
<rect class="node" x="38" y="162" width="154" height="40" rx="8"/>
<text class="mono" x="115" y="187" text-anchor="middle">tb_product</text>
<rect class="node accent" x="38" y="216" width="154" height="94" rx="8"/>
<text class="mono" x="115" y="236" text-anchor="middle">tb_outbox</text>
<!-- Exchange -->
<rect class="node accent" x="300" y="175" width="170" height="80" rx="12"/>
<text class="title" x="385" y="205" text-anchor="middle">Exchange</text>
<text class="mono" x="385" y="224" text-anchor="middle">catalog.events</text>
<text class="sub" x="385" y="242" text-anchor="middle">só roteia, não guarda</text>
<!-- Fila -->
<rect class="node accent" x="560" y="90" width="190" height="70" rx="12"/>
<text class="mono" x="655" y="108" text-anchor="middle">pricing.catalog-events</text>
<rect class="slot" x="568" y="128" width="28" height="20" rx="3"/><rect class="slot" x="604" y="128" width="28" height="20" rx="3"/><rect class="slot" x="640" y="128" width="28" height="20" rx="3"/><rect class="slot" x="676" y="128" width="28" height="20" rx="3"/><rect class="slot" x="712" y="128" width="28" height="20" rx="3"/>
<text class="sub" x="620" y="196" text-anchor="middle">Ready</text>
<text class="sub" x="700" y="196" text-anchor="middle">Unacked</text>
<!-- Pricing -->
<rect class="node" x="800" y="90" width="160" height="280" rx="12"/>
<text class="title" x="880" y="118" text-anchor="middle">Pricing</text>
<text class="sub" x="880" y="296" text-anchor="middle">tb_known_sku</text>
<text class="sub" x="880" y="346" text-anchor="middle">tb_processed_event</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<line class="link" x1="210" y1="215" x2="298" y2="215" marker-end="url(#a)"/>
<text class="sub" x="254" y="206" text-anchor="middle">publica</text>
<line class="link" x1="470" y1="203" x2="558" y2="135" marker-end="url(#a)"/>
<text class="mono" x="430" y="166" text-anchor="middle" style="fill:var(--accent)">binding product.*</text>
<line class="link" x1="750" y1="125" x2="798" y2="125" marker-end="url(#a)"/>
<text class="sub" x="775" y="112" text-anchor="middle">entrega</text>
<g class="vis v17"><rect class="pillon" x="840" y="130" width="80" height="20" rx="10"/><text class="pilltxt" x="880" y="144">ONLINE</text></g><g class="vis v16"><rect class="silloff" x="840" y="130" width="80" height="20" rx="10"/><text class="pilltxt" x="880" y="144">OFFLINE</text></g><text class="sub vis v18" x="880" y="178" text-anchor="middle">aguardando cartas</text><text class="sub vis v19" x="880" y="178" text-anchor="middle">recebeu a carta</text><text class="sub vis v20" x="880" y="178" text-anchor="middle">gravou o SKU</text><text class="sub vis v21" x="880" y="178" text-anchor="middle">confirmou (ack)</text>
<text class="tag vis v1" x="24" y="424">PASSO 1 DE 7</text><text class="cap vis v1" x="24" y="446">Você cadastra o produto. O catálogo grava o produto e uma carta (tb_outbox)</text><text class="cap vis v1" x="24" y="468">na mesma transação do banco.</text><text class="tag vis v2" x="24" y="424">PASSO 2 DE 7</text><text class="cap vis v2" x="24" y="446">O catálogo entrega a carta ao RabbitMQ, no exchange catalog.events.</text><text class="cap vis v2" x="24" y="468">O exchange só roteia, não guarda nada.</text><text class="tag vis v3" x="24" y="424">PASSO 3 DE 7</text><text class="cap vis v3" x="24" y="446">A chave da carta (product.created) casa com o binding product.*,</text><text class="cap vis v3" x="24" y="468">e a carta vai para a fila do pricing.</text><text class="tag vis v4" x="24" y="424">PASSO 4 DE 7</text><text class="cap vis v4" x="24" y="446">A carta espera na fila: Ready = 1.</text><text class="cap vis v4" x="24" y="468">Ela fica ali até alguém buscar.</text><text class="tag vis v5" x="24" y="424">PASSO 5 DE 7</text><text class="cap vis v5" x="24" y="446">O pricing busca a carta. Ela vira Unacked:</text><text class="cap vis v5" x="24" y="468">entregue, mas ainda não confirmada.</text><text class="tag vis v6" x="24" y="424">PASSO 6 DE 7</text><text class="cap vis v6" x="24" y="446">O pricing anota a carta no inbox (tb_processed_event) e grava o SKU</text><text class="cap vis v6" x="24" y="468">em tb_known_sku, tudo na mesma transação.</text><text class="tag vis v7" x="24" y="424">PASSO 7 DE 7</text><text class="cap vis v7" x="24" y="446">O pricing confirma (ack) e o RabbitMQ apaga a carta.</text><text class="cap vis v7" x="24" y="468">Fila vazia é o estado saudável.</text><text class="big vis v8" x="620" y="222">0</text><text class="big vis v9" x="620" y="222">1</text><text class="big vis v10" x="700" y="222">0</text><text class="big vis v11" x="700" y="222">1</text><text class="big vis v12" x="880" y="322">0</text><text class="big vis v13" x="880" y="322">1</text><text class="big vis v14" x="880" y="372">0</text><text class="big vis v15" x="880" y="372">1</text>
<g class="msg m0"><rect width="28" height="20" rx="3"/><path d="M2 3 L14 12 L26 3"/><text x="14" y="-4">#1</text></g>
<line x1="24" y1="404" x2="956" y2="404" stroke="var(--line)"/>
</svg>