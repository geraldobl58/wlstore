# =============================================================================
# Dependabot — atualização contínua de dependências (gerado a partir de
# templates/github/dependabot.yml do repo de infra).
#
# Toda segunda abre PRs AGRUPADOS para a branch develop: passam pelo CI
# (lint + testes + build + scan) e seguem o fluxo normal develop → main.
# Correções de SEGURANÇA (Dependabot security updates, ligado por
# `make github`) vão direto para a main, também validadas pelo check `ci`.
# =============================================================================
version: 2
updates:
  - package-ecosystem: maven
    directory: "/wlstore-be/catalog-service"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      catalog-service-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: "/wlstore-be/pricing-service"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pricing-service-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: "/wlstore-be/wlstore-common"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      wlstore-common-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/wlstore-fe"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      wlstore-fe-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/wlstore-be"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-be-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/wlstore-fe"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-fe-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
